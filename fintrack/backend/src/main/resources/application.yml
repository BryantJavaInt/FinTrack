spring:
  application:
    name: fintrack-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USER:fintrack}
    password: ${DB_PASS:fintrack}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

fintrack:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  exchange-rate:
    base-url: ${EXCHANGE_RATE_URL:https://api.frankfurter.dev}

springdoc:
  api-docs:
    path: /api/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fintrack: DEBUG
    org.flywaydb: INFO